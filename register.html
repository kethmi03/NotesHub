<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | NotesHub</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= AUTH SECTION ================= -->

    <section class="auth-section">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="background.mp4" type="video/mp4">
        </video>

        <div class="auth-split">
            <div class="auth-split-image">
                <div class="image-overlay">
                    <h2>Join NotesHub</h2>
                    <p>Unlock thousands of study materials and share your own knowledge with the community.</p>
                </div>
            </div>

            <div class="auth-container">

                <div class="auth-header">
                    <h2>Create an Account</h2>
                    <p>Join the student knowledge marketplace today.</p>
                </div>

            <form id="registerForm" class="auth-form">

                <div class="input-group">
                    <label for="reg-name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg-name" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="john@gmail.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-password" placeholder="Create a strong password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-confirm-password" placeholder="Confirm your password" required>
                    </div>
                </div>

                <div id="registerMessage" class="form-message" aria-live="polite"></div>

                <button type="submit" class="auth-submit-btn">Register</button>

            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Log in here</a></p>
            </div>

            </div>
        </div>
    </section>

    <script type="module" src="js/main.js"></script>

    <script src="js/theme.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
