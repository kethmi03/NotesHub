<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NotesHub</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= AUTH SECTION ================= -->

    <section class="auth-section">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="background.mp4" type="video/mp4">
        </video>

        <div class="auth-split">
            <div class="auth-split-image">
                <div class="image-overlay">
                    <h2>Welcome to NotesHub</h2>
                    <p>Your journey to better grades starts here. Discover notes, share knowledge, and succeed together.</p>
                </div>
            </div>

            <div class="auth-container">

                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Log in to access your notes and account.</p>
                </div>

            <form id="loginForm" class="auth-form">

                <div class="input-group">
                    <label for="login-email">Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="john@gmail.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <div id="loginMessage" class="form-message" aria-live="polite"></div>

                <button type="submit" class="auth-submit-btn">Login</button>

            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create one here</a></p>
            </div>

            </div>
        </div>
    </section>

    <script type="module" src="js/main.js"></script>

    <script src="js/theme.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
