<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Note | NotesHub</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= UPLOAD SECTION ================= -->

    <section class="upload-section">

        <div class="upload-container">

            <div class="upload-header">
                <h2>Upload Your Notes</h2>
                <p>Share your knowledge and help others succeed.</p>
            </div>

            <form id="uploadForm" class="upload-form">

                <div class="form-grid">

                    <div class="input-group">
                        <label for="note-title">Note Title</label>
                        <input type="text" id="note-title" placeholder="e.g., Software Engineering Complete Guide" required>
                    </div>

                    <div class="input-group">
                        <label for="note-subject">Subject Area</label>
                        <select id="note-subject" required>
                            <option value="">Select a subject...</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Business">Business & Finance</option>
                            <option value="Engineering">Engineering</option>
                            <option value="English">English</option>
                            <option value="Science">Science</option>
                            <option value="Physics">Physics</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="note-module">Topic / Course</label>
                        <input type="text" id="note-module" placeholder="e.g., CS2001, Calculus, Software Engineering" required>
                    </div>

                    <div class="input-group">
                        <label for="note-semester">Grade Level</label>
                        <select id="note-semester" required>
                            <option value="">Select grade level...</option>
                            <option value="Grade 6 - 9">Grade 6 - 9</option>
                            <option value="Grade 10 - 11">Grade 10 - 11</option>
                            <option value="Grade 12 - 13">Grade 12 - 13</option>
                            <option value="Undergraduate">University / Undergraduate</option>
                            <option value="Postgraduate">University / Postgraduate</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="note-doctype">Document Type</label>
                        <select id="note-doctype">
                            <option value="Lecture Notes">Lecture Notes</option>
                            <option value="Summary">Summary</option>
                            <option value="Past Exams">Past Exams</option>
                            <option value="Practice">Practice / Assignment</option>
                        </select>
                    </div>

                    <div class="input-group full-width">
                        <label for="note-description">Description</label>
                        <textarea id="note-description" rows="4" placeholder="Briefly describe what these notes cover..." required></textarea>
                    </div>

                    <div class="input-group">
                        <label for="note-tags">Tags</label>
                        <input type="text" id="note-tags" placeholder="e.g., summary, past papers (comma separated)">
                    </div>

                </div>

                <div class="file-upload-area" id="fileUploadArea">
                    <input type="file" id="note-file" accept=".pdf,.doc,.docx,.ppt,.pptx" hidden required>
                    <div class="upload-icon">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <h3>Drag & Drop your file here</h3>
                    <p>or click to browse from your device</p>
                    <span class="file-limits">Supported formats: PDF, DOCX, PPTX (Max 20MB)</span>
                    <button type="button" class="browse-btn" onclick="document.getElementById('note-file').click()">Browse File</button>
                </div>

                <div id="uploadMessage" class="form-message" aria-live="polite"></div>

                <div class="form-actions">
                    <a href="my-notes.html" class="cancel-btn">Cancel</a>
                    <button type="submit" class="submit-note-btn">Upload Note</button>
                </div>

            </form>

        </div>

    </section>

    <script type="module" src="js/main.js"></script>

    <script src="js/theme.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
