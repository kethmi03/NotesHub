<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | NotesHub</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= DASHBOARD SECTION ================= -->

    <section class="dashboard-section">

        <div class="dashboard-sidebar">
            <div class="sidebar-user">
                <div class="avatar-large">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3>Student</h3>
                <p>Student Account</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Overview</a>
                <a href="my-notes.html"><i class="fa-solid fa-file-lines"></i> My Notes</a>
                <a href="saved-notes.html"><i class="fa-solid fa-bookmark"></i> Saved Notes</a>

                <a href="settings.html" class="active"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>

            <a href="upload-note.html" class="upload-btn">
                <i class="fa-solid fa-plus"></i> Upload New Note
            </a>
        </div>

        <div class="dashboard-content">

            <div class="dashboard-header">
                <h2>Settings</h2>
                <p>Manage your account preferences</p>
            </div>

            <!-- Settings Sections -->
            <div class="settings-container">

                <!-- Account Settings -->
                <div class="settings-section">
                    <div class="settings-section-header">
                        <h3><i class="fa-solid fa-user"></i> Account Information</h3>
                    </div>

                    <form class="settings-form" id="accountForm">
                        <div id="accountMessage" class="form-message"></div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="full-name">Full Name</label>
                                <input type="text" id="full-name" placeholder="Full Name" required>
                            </div>

                            <div class="input-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" placeholder="Email Address" readonly style="background-color: var(--bg-secondary); cursor: not-allowed;" title="Email cannot be changed" required>
                            </div>
                        </div>

                        <button type="submit" class="save-btn">
                            <i class="fa-solid fa-floppy-disk"></i> Save Changes
                        </button>
                    </form>
                </div>

                <!-- Password Settings -->
                <div class="settings-section">
                    <div class="settings-section-header">
                        <h3><i class="fa-solid fa-lock"></i> Change Password</h3>
                    </div>

                    <form class="settings-form" id="passwordForm">
                        <div id="passwordMessage" class="form-message"></div>
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label for="current-password">Current Password</label>
                                <input type="password" id="current-password" placeholder="Current Password" required>
                            </div>

                            <div class="input-group full-width">
                                <label for="new-password">New Password</label>
                                <input type="password" id="new-password" placeholder="New Password (min 6 characters)" required>
                            </div>

                            <div class="input-group full-width">
                                <label for="confirm-password">Confirm New Password</label>
                                <input type="password" id="confirm-password" placeholder="Confirm New Password" required>
                            </div>
                        </div>

                        <button type="submit" class="save-btn">
                            <i class="fa-solid fa-lock"></i> Update Password
                        </button>
                    </form>
                </div>

                <!-- Notification Settings -->
                <div class="settings-section">
                    <div class="settings-section-header">
                        <h3><i class="fa-solid fa-bell"></i> Notifications</h3>
                    </div>

                    <form class="settings-form" id="notificationsForm">
                        <div id="notificationsMessage" class="form-message"></div>
                        <div class="checkbox-group">
                            <label class="custom-checkbox">
                                <input type="checkbox" checked>
                                Email me when someone downloads my notes
                            </label>
                            <label class="custom-checkbox">
                                <input type="checkbox" checked>
                                Email me when someone rates my notes
                            </label>
                            <label class="custom-checkbox">
                                <input type="checkbox">
                                Email me about new notes matching my interests
                            </label>
                            <label class="custom-checkbox">
                                <input type="checkbox" checked>
                                Weekly digest of platform activity
                            </label>
                        </div>

                        <button type="submit" class="save-btn">
                            <i class="fa-solid fa-floppy-disk"></i> Save Preferences
                        </button>
                    </form>
                </div>

                <!-- Danger Zone -->
                <div class="settings-section danger-zone">
                    <div class="settings-section-header">
                        <h3><i class="fa-solid fa-triangle-exclamation"></i> Danger Zone</h3>
                    </div>

                    <div class="danger-actions">
                        <button type="button" class="danger-btn" id="deactivateAccountBtn">
                            <i class="fa-solid fa-exclamation-circle"></i> Deactivate Account
                        </button>
                        <p>Your account and all data will be permanently deleted.</p>
                    </div>
                </div>

            </div>

        </div>

    </section>

    <script type="module" src="js/main.js?v=2.3"></script>

    <script src="js/theme.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
