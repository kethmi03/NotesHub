<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Notes | NotesHub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= DASHBOARD SECTION ================= -->

    <section class="dashboard-section">

        <div class="dashboard-sidebar">
            <div class="sidebar-user">
                <div class="avatar-large">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3>John Doe</h3>

            </div>

            <nav class="sidebar-nav">
                <a href="settings.html"><i class="fa-solid fa-user"></i> Profile Details</a>
                <a href="my-notes.html" class="active"><i class="fa-solid fa-file-lines"></i> My Notes</a>
                <a href="saved-notes.html"><i class="fa-solid fa-bookmark"></i> Saved Notes</a>
            </nav>

            <a href="upload-note.html" class="upload-btn">
                <i class="fa-solid fa-plus"></i> Upload New Note
            </a>
        </div>

        <div class="dashboard-content">

            <div class="dashboard-header">
                <h2>My Notes</h2>
                <p>All the notes you've uploaded</p>
            </div>

            <!-- Filter and Search -->
            <div class="browse-header" style="margin-bottom: 30px;">
                <div style="display: flex; gap: 20px; flex: 1;">
                    <div class="search-box" style="flex: 1; max-width: 300px;">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="myNotesSearch" placeholder="Search your notes...">
                    </div>
                </div>

                <div class="sort-box">
                    <label>Sort by:</label>
                    <select id="myNotesSort">
                        <option value="recent">Most Recent</option>
                        <option value="downloads">Most Downloaded</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
            </div>

            <div id="myNotesStatus" class="form-message" style="display:none; margin-bottom: 20px;"></div>

            <!-- My Notes Grid -->
            <div class="recent-notes">
                <div class="notes-grid" id="myNotesGrid">
                    <!-- Populated dynamically by setupMyNotes -->
                </div>

            </div>

        </div>

    </section>

    <script type="module" src="js/main.js"></script>

    <script src="js/theme.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
